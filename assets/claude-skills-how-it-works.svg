<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#5b7fa6"/></marker></defs>
  <rect width="1200" height="640" rx="20" fill="#eef2f6"/>
  <text x="56" y="70" font-size="16" font-weight="700" letter-spacing="3.5" fill="#4a6a8f">CROSS-PROJECT-EXTRACTION · ONE TRIP, THREE STOPS</text>

  <rect x="56" y="100" width="300" height="230" rx="18" fill="#ffffff" stroke="#d5dfe8" stroke-width="2"/>
  <text x="84" y="142" font-size="14" font-weight="700" letter-spacing="3" fill="#5b7fa6">1 · HOME PROJECT</text>
  <text x="84" y="184" font-size="30" font-weight="800" fill="#1e2d42">Outbound</text>
  <text x="84" y="220" font-size="17" fill="#4a6a8f">Say what you need and</text>
  <text x="84" y="244" font-size="17" fill="#4a6a8f">where it might live.</text>
  <rect x="84" y="272" width="170" height="36" rx="8" fill="#1e2d42"/>
  <text x="169" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Search Brief</text>

  <line x1="368" y1="215" x2="436" y2="215" stroke="#5b7fa6" stroke-width="4" marker-end="url(#a)"/>
  <text x="404" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#4a6a8f">paste</text>

  <rect x="450" y="100" width="300" height="230" rx="18" fill="#ffffff" stroke="#d5dfe8" stroke-width="2"/>
  <text x="478" y="142" font-size="14" font-weight="700" letter-spacing="3" fill="#5b7fa6">2 · OTHER PROJECT</text>
  <text x="478" y="184" font-size="30" font-weight="800" fill="#1e2d42">Extract</text>
  <text x="478" y="220" font-size="17" fill="#4a6a8f">Claude searches from 2 or 3</text>
  <text x="478" y="244" font-size="17" fill="#4a6a8f">angles and keeps the best.</text>
  <rect x="478" y="272" width="170" height="36" rx="8" fill="#1e2d42"/>
  <text x="563" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Extract Block</text>

  <line x1="762" y1="215" x2="830" y2="215" stroke="#5b7fa6" stroke-width="4" marker-end="url(#a)"/>
  <text x="798" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#4a6a8f">paste</text>

  <rect x="844" y="100" width="300" height="230" rx="18" fill="#ffffff" stroke="#d5dfe8" stroke-width="2"/>
  <text x="872" y="142" font-size="14" font-weight="700" letter-spacing="3" fill="#5b7fa6">3 · HOME PROJECT</text>
  <text x="872" y="184" font-size="30" font-weight="800" fill="#1e2d42">Inbound</text>
  <text x="872" y="220" font-size="17" fill="#4a6a8f">Restate the problem, then</text>
  <text x="872" y="244" font-size="17" fill="#4a6a8f">judge what came back.</text>
  <rect x="872" y="272" width="170" height="36" rx="8" fill="#1e2d42"/>
  <text x="957" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Synthesis Note</text>

  <path d="M994 342 V372 H600 V342" fill="none" stroke="#5b7fa6" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#a)"/>
  <text x="797" y="396" text-anchor="middle" font-size="14" font-weight="700" fill="#4a6a8f">not enough? go back with a Sharpened Brief</text>

  <text x="56" y="462" font-size="16" font-weight="700" letter-spacing="3.5" fill="#4a6a8f">RETRIEVAL-COACH · WHEN YOU'RE THERE AND CAN'T NAME IT</text>
  <g font-size="17" font-weight="700">
    <rect x="56" y="488" width="236" height="96" rx="18" fill="#ffffff" stroke="#d5dfe8" stroke-width="2"/>
    <text x="174" y="530" text-anchor="middle" fill="#1e2d42">Vague idea</text>
    <text x="174" y="556" text-anchor="middle" font-size="14" font-weight="400" fill="#4a6a8f">"that thing about..."</text>
    <line x1="302" y1="536" x2="330" y2="536" stroke="#5b7fa6" stroke-width="4" marker-end="url(#a)"/>
    <rect x="344" y="488" width="236" height="96" rx="18" fill="#ffffff" stroke="#d5dfe8" stroke-width="2"/>
    <text x="462" y="530" text-anchor="middle" fill="#1e2d42">One question</text>
    <text x="462" y="556" text-anchor="middle" font-size="14" font-weight="400" fill="#4a6a8f">from a new angle</text>
    <line x1="590" y1="536" x2="618" y2="536" stroke="#5b7fa6" stroke-width="4" marker-end="url(#a)"/>
    <rect x="632" y="488" width="236" height="96" rx="18" fill="#ffffff" stroke="#d5dfe8" stroke-width="2"/>
    <text x="750" y="530" text-anchor="middle" fill="#1e2d42">2 or 3 keyword angles</text>
    <text x="750" y="556" text-anchor="middle" font-size="14" font-weight="400" fill="#4a6a8f">different cuts, never synonyms</text>
    <line x1="878" y1="536" x2="906" y2="536" stroke="#5b7fa6" stroke-width="4" marker-end="url(#a)"/>
    <rect x="920" y="488" width="224" height="96" rx="18" fill="#1e2d42"/>
    <text x="1032" y="530" text-anchor="middle" fill="#ffffff">Found + debrief</text>
    <text x="1032" y="556" text-anchor="middle" font-size="14" font-weight="400" fill="#d5dfe8">why the keyword worked</text>
  </g>
</svg>
